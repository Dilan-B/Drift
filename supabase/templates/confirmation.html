<!--
  Supabase Auth > Email Templates > Confirm signup (applied via the Management API).
  Subject: Your Drift code: {{ .Token }}
  The app verifies with an 8-digit OTP (mailer_otp_length = 8), so {{ .Token }} MUST be in
  this template. It was link-only for a while, which left sign-ups waiting on a code that
  was generated but never sent. The link is kept as a fallback; the app handles both.
-->
<div style="font-family:-apple-system,Helvetica,Arial,sans-serif;max-width:440px;margin:0 auto;padding:24px;color:#1A2820">
  <h2 style="margin:0 0 12px;font-weight:600">Your Drift code</h2>
  <p style="margin:0 0 20px;color:#6B7A6E">Enter this code in Drift to finish creating your account.</p>
  <p style="margin:0 0 24px;font-size:32px;font-weight:700;letter-spacing:8px;font-family:Menlo,Consolas,monospace">{{ .Token }}</p>
  <p style="margin:0 0 8px;color:#6B7A6E;font-size:13px">It expires in 1 hour. On your phone, you can also just <a href="{{ .ConfirmationURL }}" style="color:#2D6B47">tap here to confirm</a>.</p>
  <p style="margin:16px 0 0;color:#A8B0A8;font-size:12px">Didn't sign up for Drift? You can ignore this email.</p>
</div>
