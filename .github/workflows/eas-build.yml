name: EAS Build

# Manual trigger only — building costs EAS build credits, so we never run it
# automatically on push. Kick it off from the Actions tab ("Run workflow") and
# pick a platform + profile.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        type: choice
        default: ios
        options:
          - ios
          - android
          - all
      profile:
        description: "EAS build profile (see eas.json)"
        type: choice
        default: preview
        options:
          - development   # dev client, real device, internal
          - preview       # standalone internal build (share via QR/link)
          - production    # store build

jobs:
  build:
    name: Trigger EAS build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Queues the build on EAS servers and returns immediately (--no-wait) so
      # we don't hold a GitHub runner for the ~20+ min compile. Track progress
      # and download the artifact from the printed expo.dev link (or `eas build:list`).
      - name: Start build
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --no-wait
